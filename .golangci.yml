# golangci-lint v2 configuration.
#
# The version key is load-bearing: v1 and v2 read incompatible schemas, and a v1
# file silently fails the whole run under a v2 binary with "unsupported version
# of the configuration". CI pins the same major version this file declares.
version: "2"

run:
  timeout: 5m

linters:
  # gosimple no longer exists in v2: its checks moved into staticcheck.
  enable:
    - errcheck
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused

  settings:
    staticcheck:
      # v1 ran the SA (correctness) and S1 (simplification) families; the ST
      # style checks lived in a separate linter that was never enabled, and QF
      # is new in v2. Both are style advice, so enabling them here would turn a
      # tooling migration into a repo-wide restyle. Measured with both removed
      # on 2026-09-06: 18 findings, 12 of them ST1003 naming. Re-measure before
      # turning them on; the tree has lost a lot of code since.
      checks:
        - all
        - -ST*
        - -QF*

  exclusions:
    # v1 applied its default exclusion set automatically; v2 does not. Without
    # these presets the migration would report 50+ pre-existing style findings
    # that the v1 run never showed, which is a different piece of work.
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

    rules:
      # G101 flags any identifier that looks credential-shaped next to a string
      # literal. In tests those literals ARE the fixture: a signing key the test
      # signs a request with, or an error message a test asserts is not leaked.
      # Excluded only in test files, so a real hardcoded credential in shipped
      # code is still reported.
      - path: _test\.go
        linters:
          - gosec
        text: "G101"

      # G115 flags every narrowing integer conversion. In tests the narrowing is
      # the point: building a byte pattern from a counter, or splitting a
      # checksum into its four bytes. Production narrowing stays reported.
      - path: _test\.go
        linters:
          - gosec
        text: "G115"

      # The same two, for the test tree's support files. They are not _test.go —
      # a fixture generator, a seeded PRNG, a workload builder — but they are
      # test code all the same, and they are compiled into no shipped binary.
      - path: ^test/
        linters:
          - gosec
        text: "G101|G115"

      # What a test fixture is allowed to do that shipped code is not. Each is
      # the fixture itself, never a control the product relies on:
      #   G102 a test proxy binding :0 to take whatever port is free
      #   G306 a benchmark report written for a human to read
      #   G402 the demo stack's self-signed CA, which is the point of the TLS run
      #   G404 a seeded PRNG, so a failing payload can be reproduced exactly
      #   G501 crypto/md5, because Content-MD5 is an S3 header this suite asserts
      - path: ^test/
        linters:
          - gosec
        text: "G102|G306|G402|G404|G501"

      # The integration suite signs, uploads and resolves endpoints the way the
      # SDKs in the field still do. A deprecated-but-shipped API is exactly what
      # has to keep working through this proxy (ADR 0006), so the suite follows
      # the SDK's deprecations rather than leading them. Production code does
      # not get this exemption.
      - path: ^test/
        linters:
          - staticcheck
        text: "SA1019"

      # test/integration is the shared helper package, dot-imported by every
      # suite package so a helper reads the same in all of them.
      - path: ^test/
        linters:
          - revive
        text: "dot-imports"

      # A test helper leads with *testing.T: it is the parameter the helper is
      # about — t.Helper(), require against t — and every helper in this suite is
      # written that way. Measured on 2026-09-13, when the test tree first came
      # under the linter: 82 findings, all of them this one, all of them a
      # parameter swap in code that has no defect. Turning the suite around for a
      # style convention is the repo-wide restyle this file already declined for
      # the ST checks. Production code still gets the rule.
      - path: ^test/
        linters:
          - revive
        text: "context-as-argument"
