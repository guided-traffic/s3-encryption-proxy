# golangci-lint v2 configuration.
#
# The version key is load-bearing: v1 and v2 read incompatible schemas, and a v1
# file silently fails the whole run under a v2 binary with "unsupported version
# of the configuration". CI pins the same major version this file declares.
version: "2"

run:
  timeout: 5m

linters:
  # gosimple no longer exists in v2: its checks moved into staticcheck.
  enable:
    - errcheck
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused

  settings:
    gosec:
      excludes:
        # G709 flags every xml.Unmarshal whose input taint-traces back to an HTTP
        # request body. It fires on the S3 sub-resource handlers (?acl, ?cors,
        # ?logging), on DeleteObjects and on CompleteMultipartUpload - which is
        # to say, on every handler that parses the XML documents the S3 API is
        # defined in terms of. It only started firing when the coverage round
        # added tests that drive those handlers end to end, which is what made
        # the taint path visible; the handlers themselves did not change.
        #
        # The check is aimed at polymorphic deserializers that instantiate types
        # named in the payload. encoding/xml is not one: it fills a fixed struct,
        # it does not resolve external entities, and it cannot construct a type
        # the code did not declare. So the CWE-502 reading does not apply here.
        #
        # What IS real in that area is unbounded body size - ReadBody buffers the
        # whole request and only its pre-allocation is clamped - and that is
        # tracked as its own finding in docs/tickets/024-coverage-round-findings.md
        # rather than papered over here. Suppressing G709 does not suppress that.
        - G709
    staticcheck:
      # v1 ran the SA (correctness) and S1 (simplification) families; the ST
      # style checks lived in a separate linter that was never enabled, and QF
      # is new in v2. Both are style advice, so enabling them here would turn a
      # tooling migration into a repo-wide restyle.
      checks:
        - all
        - -ST*
        - -QF*

  exclusions:
    # v1 applied its default exclusion set automatically; v2 does not. Without
    # these presets the migration would report 50+ pre-existing style findings
    # that the v1 run never showed, which is a different piece of work.
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

    rules:
      # G101 flags any identifier that looks credential-shaped next to a string
      # literal. In tests those literals ARE the fixture: a signing key the test
      # signs a request with, or an error message a test asserts is not leaked.
      # Excluded only in test files, so a real hardcoded credential in shipped
      # code is still reported.
      - path: _test\.go
        linters:
          - gosec
        text: "G101"

      # G115 flags every narrowing integer conversion. In tests the narrowing is
      # the point: building a byte pattern from a counter, or splitting a
      # checksum into its four bytes. Production narrowing stays reported.
      - path: _test\.go
        linters:
          - gosec
        text: "G115"
