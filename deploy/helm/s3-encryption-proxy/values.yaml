# Default values for s3-encryption-proxy.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Defaults are tuned for evaluating the proxy: a single replica, no PodDisruptionBudget.
# For production see values-production.yaml (multiple replicas, PDB, autoscaling, TLS).
replicaCount: 1

image:
  registry: docker.io
  repository: guidedtraffic/s3-encryption-proxy
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podLabels: {}

podSecurityContext:
  fsGroup: 1001
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  # Pin the node port instead of letting Kubernetes allocate one. Only honoured
  # with type: NodePort; a host-side URL that has to stay fixed needs it.
  nodePort: ""
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: s3-proxy.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: s3-proxy-tls
  #    hosts:
  #      - s3-proxy.local

# TLS at the proxy's own Service (ADR 0026).
#
# This is the deployment this proxy is normally used in: one proxy beside each S3
# client, reached in-cluster at <name>.<namespace>.svc.cluster.local. The traffic
# on that leg carries the client's SigV4 credentials, every object key, and the
# plaintext of every object, so it is worth terminating TLS on.
#
# Off by default. With it on, the chart mounts the certificate and adds the tls:
# block to the rendered configuration -- so do NOT also write a tls: block into
# `config` below, or the render fails rather than letting the two disagree.
serviceTLS:
  enabled: false
  # Bring your own: a Secret holding tls.crt and tls.key. Set this and no
  # cert-manager Certificate is issued and cert-manager is not required at all.
  existingSecret: ""
  # Otherwise cert-manager issues one for the Service names the chart computes:
  # <name>, <name>.<ns>, <name>.<ns>.svc and <name>.<ns>.svc.<clusterDomain>.
  issuer:
    kind: ClusterIssuer  # or Issuer
    name: ""             # required unless existingSecret is set
  # Added to the four computed names, never instead of them.
  extraDNSNames: []
  annotations: {}
  # Where the certificate is mounted, and what the injected tls: block points at.
  mountPath: /app/tls

# The cluster's DNS domain. Only used to build the certificate's fourth Service
# name; a cluster built on another domain has to set it, because the chart cannot
# discover it and a wrong value produces a certificate that fails verification for
# the name most clients use.
clusterDomain: cluster.local

# Certificate management with cert-manager, for TLS terminated at the INGRESS.
# For TLS at the Service, see serviceTLS above.
certificate:
  enabled: false
  issuer:
    # Use 'cluster-issuer' or 'issuer'
    kind: ClusterIssuer
    name: letsencrypt-prod
  dnsNames:
    - s3-proxy.local
  secretName: s3-proxy-tls
  annotations: {}

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# The probe scheme is derived from tls.enabled in the config below, so a pod that
# serves TLS is probed over TLS. Set this only when the chart cannot see the
# config -- configMap.useExistingConfigMap: true -- or to override the derivation.
probes:
  scheme: ""  # empty = derive; HTTP or HTTPS

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# ConfigMap configuration
configMap:
  # Use an existing ConfigMap instead of generating one
  useExistingConfigMap: false
  # Name of the existing ConfigMap (only used when useExistingConfigMap is true)
  existingConfigMapName: ""

# Additional volumes on the output Deployment definition.
# The chart always creates 'config' and 'tmp' volumes automatically.
volumes: []

# Additional volumeMounts on the output Deployment definition.
# The chart always mounts 'config' at /app/config and 'tmp' at /tmp automatically.
volumeMounts: []

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - s3-encryption-proxy
        topologyKey: kubernetes.io/hostname

# Pod Disruption Budget
# Disabled by default because the default deployment runs a single replica:
# a PDB would then block every voluntary eviction, so node drains and cluster
# upgrades hang indefinitely.
# Recommended for production: run at least 2 replicas and enable this
# (see values-production.yaml).
# Set either minAvailable or maxUnavailable, never both - Kubernetes rejects a
# PDB that specifies both. maxUnavailable is the safer default: it stays
# drainable at any replica count, while minAvailable can deadlock drains when it
# equals the replica count.
podDisruptionBudget:
  enabled: false
  maxUnavailable: 1
  # minAvailable: 1

# Kubernetes termination grace period. Leave unset and the chart derives it from
# the shutdown_timeout in the config below, plus five seconds (ADR 0015 D5): the
# platform must not kill the process before its own transfer budget has expired.
# Set it only to override that derivation.
terminationGracePeriodSeconds: ""

# S3 Encryption Proxy Configuration (raw config.yaml content)
# This is passed 1:1 into the ConfigMap as config.yaml
config: |
  bind_address: "0.0.0.0:8080"
  log_level: "info"

  # Seconds an in-flight transfer gets when the process is asked to stop, and
  # the only server-side limit on a running transfer (ADR 0015). The pod's
  # termination grace period is derived from it. Raising it protects large
  # transfers across a rollout and makes every rollout slower by the same
  # amount.
  shutdown_timeout: 30

  # Listener budgets, seconds. 0 on the two body budgets means no deadline,
  # which is the shipped answer: a transfer is bounded by the client, not by a
  # server wall clock, so no healthy upload or download is ever cut for being
  # long or slow. Set one only if you want a ceiling and know your workload.
  # The other two bound what is not a transfer and may not be 0.
  read_timeout: 0
  write_timeout: 0
  read_header_timeout: 30
  idle_timeout: 60

  s3_backend:
    target_endpoint: "https://s3.amazonaws.com"
    region: "us-east-1"
    access_key_id: "${S3_ACCESS_KEY_ID}"
    secret_key: "${S3_SECRET_KEY}"

  s3_clients:
    - type: "static"
      access_key_id: "${S3_ACCESS_KEY_ID}"
      secret_key: "${S3_SECRET_KEY}"

  encryption:
    encryption_method_alias: "default"
    # The proxy's exclusive metadata namespace (ADR 0009). Shown at its default;
    # changing it makes every object written under the old one unreadable.
    metadata_key_prefix: "s3ep-"
    providers:
      - alias: "default"
        type: "aes"
        description: "Default AES envelope encryption"
        config:
          # No default key. The value below is an environment variable reference
          # the proxy resolves at startup: set S3EP_AES_KEY (see secrets below).
          # A literal key in a published chart is a key everyone has, so a
          # release that took the default would encrypt every object with it.
          aes_key: "${S3EP_AES_KEY}"

# Environment variables (additional custom env vars can be added here)
env: []

# Secrets configuration
secrets:
  # S3 credentials
  s3:
    accessKeyId: ""
    secretKey: ""

  # The key encryption key, supplied to the pod as S3EP_AES_KEY, which the
  # config block above references as ${S3EP_AES_KEY}. Without one the pod does
  # not start: there is no default key and no fallback (ADR 0021).
  encryption:
    # base64 of exactly 32 random bytes; `s3ep-keygen` or `openssl rand -base64 32`.
    # Anything set here lands in the release's own Secret, so it is also in
    # whatever holds this values file. Prefer existingSecret.
    aesKey: ""
    # A Secret you manage yourself. Takes precedence over aesKey.
    existingSecret: ""
    existingSecretKey: "aes-key"


# License configuration
license:
  # Existing secret containing the license
  # If specified, this takes precedence over license.jwt
  existingSecret: ""
  # Key within the existingSecret that contains the license JWT
  existingSecretKey: "license.jwt"
  # Direct license JWT content (will be stored in generated secret)
  # Only used if existingSecret is not specified
  jwt: ""

# Monitoring
monitoring:
  # Enable Prometheus monitoring
  enabled: false
  # Port for monitoring endpoints
  port: 9090
  # Path for metrics endpoint
  metricsPath: /metrics
  # Service configuration for monitoring
  service:
    enabled: false
    type: ClusterIP
    port: 9090
    targetPort: 9090
    annotations: {}
  # ServiceMonitor for Prometheus Operator
  serviceMonitor:
    enabled: false
    namespace: monitoring
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    annotations: {}
    # Override port for ServiceMonitor (defaults to monitoring.port)
    port: ""
    # Override path for ServiceMonitor (defaults to monitoring.metricsPath)
    path: ""

  # Grafana Dashboard configuration
  grafana:
    dashboard:
      enabled: false
      # Namespace where dashboard ConfigMap should be created
      namespace: ""  # defaults to release namespace
      # Labels for dashboard discovery by Grafana
      labels:
        grafana_dashboard: "1"
        # Common labels for Grafana dashboard discovery
        # app.kubernetes.io/name: grafana
        # app.kubernetes.io/component: dashboard
        # Additional custom labels for specific Grafana instances
        # grafana-instance: "production"
        # dashboard-category: "monitoring"
        # team: "platform-engineering"
      # Custom annotations for the dashboard ConfigMap
      annotations: {}
        # Examples of custom annotations:
        # grafana-folder: "S3 Encryption Proxy"
        # grafana.com/dashboard-uid: "s3ep-performance"
        # grafana.com/auto-import: "true"
        # kubernetes.io/managed-by: "helm"
        # meta.helm.sh/release-name: "s3-encryption-proxy"
        # app.kubernetes.io/managed-by: "Helm"
        # config.kubernetes.io/local-config: "true"
        # description: "Performance monitoring dashboard for S3 Encryption Proxy"

# Logging
logging:
  enabled: false
  format: json
  level: info
