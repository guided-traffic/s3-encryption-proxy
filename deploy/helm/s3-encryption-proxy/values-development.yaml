# Development values for s3-encryption-proxy
# Override the default values for development/testing deployments

replicaCount: 1

image:
  repository: guidedtraffic/s3-encryption-proxy
  # Nothing publishes :dev. With IfNotPresent this resolves to an image you built
  # and tagged yourself; pin image.tag to a released version to pull one instead.
  pullPolicy: IfNotPresent
  tag: "dev"

# Minimal resources for development
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Disable autoscaling in development
autoscaling:
  enabled: false

# Development logging
logging:
  enabled: true
  format: text
  level: debug

# No Ingress in development. This proxy is normally reached as an in-cluster
# Service by a client running beside it, not from outside; and the chart refuses
# an enabled Ingress with no TLS, because the S3 credentials and object keys
# would cross it in plaintext. Reach it with:
#   kubectl port-forward svc/<release>-s3-encryption-proxy 8080:8080
ingress:
  enabled: false

# No cert-manager Certificate in development: nothing would consume it, and the
# chart refuses that too.
certificate:
  enabled: false

# Development S3 configuration (raw config.yaml content, passed 1:1 into the ConfigMap)
config: |
  bind_address: "0.0.0.0:8080"
  log_level: "debug"

  s3_backend:
    # https, not http: under a provider that encrypts, a plain-http backend is
    # refused at startup (ADR 0013). Mount the MinIO CA into the pod and point
    # SSL_CERT_FILE at it; only set insecure_skip_verify: true if you have no
    # CA to mount and accept that an on-path attacker in the cluster can
    # impersonate the backend.
    target_endpoint: "https://minio.minio-system.svc.cluster.local:9000"
    region: "us-east-1"
    access_key_id: "${S3_ACCESS_KEY_ID}"
    secret_key: "${S3_SECRET_KEY}"
    insecure_skip_verify: false

  s3_clients:
    - type: "static"
      access_key_id: "${S3_ACCESS_KEY_ID}"
      secret_key: "${S3_SECRET_KEY}"
      description: "Development client"

  encryption:
    encryption_method_alias: "dev"
    providers:
      - alias: "dev"
        type: "aes"
        description: "Development AES envelope encryption"
        config:
          # No key is committed (ADR 0021). Supply one at install time:
          #   --set secrets.encryption.aesKey="$(openssl rand -base64 32)"
          aes_key: "${S3EP_AES_KEY}"

# Development credentials. They reach the pod as S3_ACCESS_KEY_ID and
# S3_SECRET_KEY and are used for both the backend and the S3 client, so the
# secret has to clear the 16-character minimum the startup check applies to
# s3_clients. Local-cluster defaults; override them for anything else.
secrets:
  s3:
    accessKeyId: "minioadmin"
    secretKey: "minioadmin-development"
