# Production values for s3-encryption-proxy
#
# Overrides the evaluation defaults in values.yaml with a hardened setup:
# multiple replicas behind a PodDisruptionBudget, autoscaling, network policies,
# monitoring and TLS terminated at the ingress.
#
# Every value marked "CHANGE ME" is a placeholder and must be replaced before
# deploying. Secrets are never stored here - pass them via --set or an external
# secret manager (see README.md).

# One instance, and the chart refuses more: a client-driven multipart upload is
# held in the process that created it, so a part reaching another pod is answered
# 404 NoSuchUpload. Several cooperating proxies are the s3-encryption-operator's
# job, not this chart's.
replicaCount: 1

image:
  # registry/repository come from values.yaml (docker.io/guidedtraffic/s3-encryption-proxy).
  # The tag defaults to the chart appVersion; pin it here if you deploy a fixed version.
  pullPolicy: Always

# Production resource limits
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

# Autoscaling is refused by this chart for the same reason replicaCount is: a new
# pod does not take a share of the work, it takes requests that belong to an
# upload another pod is holding.
autoscaling:
  enabled: false

# A single instance cannot be drained without downtime, so the budget would only
# block the drain. Leave it off until the operator brings instances that can hand
# work over.
podDisruptionBudget:
  enabled: false

# Kept for the day a second instance is possible; inert at one replica.
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
    - labelSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - s3-encryption-proxy
      topologyKey: kubernetes.io/hostname

# Enable monitoring. The ServiceMonitor scrapes the dedicated monitoring
# Service, so monitoring.service must be enabled as well.
monitoring:
  enabled: true
  port: 9090
  metricsPath: /metrics
  service:
    enabled: true
  serviceMonitor:
    enabled: true
    namespace: monitoring
    interval: 15s
    scrapeTimeout: 10s

# TLS is terminated at the ingress by cert-manager; the pod itself serves plain
# HTTP inside the cluster.
# This file is the EXTERNAL example: TLS terminated at an Ingress. The other
# supported shape, and the more common one, is the proxy beside its client inside
# the cluster with TLS on its own Service -- set serviceTLS.enabled and an issuer
# (or serviceTLS.existingSecret) and leave the Ingress off entirely. See ADR 0026.
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Large objects must stream through the proxy, not be buffered by nginx.
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
  hosts:
    - host: s3-proxy.example.com  # CHANGE ME
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: s3-proxy-tls
      hosts:
        - s3-proxy.example.com  # CHANGE ME

# cert-manager issues the certificate into the secret referenced by ingress.tls.
# Do not additionally set the cert-manager.io/cluster-issuer ingress annotation -
# that would make ingress-shim create a second Certificate for the same secret.
certificate:
  enabled: true
  issuer:
    kind: ClusterIssuer
    name: letsencrypt-prod
  dnsNames:
    - s3-proxy.example.com  # CHANGE ME
  secretName: s3-proxy-tls

# Encryption key injection. The config below references ${S3EP_AES_KEY}; provide
# it from a secret you manage outside this chart.
env:
  - name: S3EP_AES_KEY
    valueFrom:
      secretKeyRef:
        name: s3-encryption-proxy-keys  # CHANGE ME
        key: aes-key

# Production S3 configuration (raw config.yaml content, passed 1:1 into the ConfigMap)
config: |
  bind_address: "0.0.0.0:8080"
  log_level: "info"
  log_format: "json"
  log_health_requests: false

  s3_backends:
    - target_endpoint: "https://s3.amazonaws.com"  # CHANGE ME
      region: "us-east-1"                          # CHANGE ME
      access_key_id: "${S3_ACCESS_KEY_ID}"
      secret_key: "${S3_SECRET_KEY}"
      insecure_skip_verify: false

  s3_clients:
    - type: "static"
      access_key_id: "${S3_ACCESS_KEY_ID}"
      secret_key: "${S3_SECRET_KEY}"
      description: "Primary client credentials"

  s3_security:
    max_clock_skew_seconds: 300
    max_presign_expiry_seconds: 3600  # default, one hour

  encryption:
    encryption_method_alias: "primary"
    providers:
      - alias: "primary"
        type: "aes"
        description: "Primary AES envelope encryption"
        config:
          aes_key: "${S3EP_AES_KEY}"

  optimizations:
    # These three keys decide peak resident memory. Size them against
    # resources.limits.memory above; the terms are in docs/developer/performance.md.
    multipart_part_size: 12582912            # default, 12MB; multiple of 64 KiB
    multipart_upload_concurrency: 4             # default, 1 - 32
    multipart_short_part_buffer_size: 67108864  # default, 64MB; minimum 5MB
