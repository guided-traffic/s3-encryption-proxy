# The dry run of ADR 0018 D6: on every pull request into main the release tool
# computes the next version from the pull request's commits and prints it, so a
# major is merged against a number the tool produced, not against a reading of
# the commits. Pull requests only; no tag, no changelog and no release is written.
#
# The release itself is later computed from the squash or merge message on main;
# the breaking-change guard keeps that message in agreement with the commits
# this run analyses.
name: Version Dry Run

on:
  pull_request:
    branches:
      - main
    # labeled and unlabeled: the verdict compares the computed bump with the
    # release:major label, so a label change has to re-run it.
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# semantic-release verifies push access with a `git push --dry-run` before it
# analyses a single commit, even in dry-run mode, so the token needs write access
# to contents. Nothing in this run pushes: it stops before the tag, the changelog
# and the release. Same-repository pull requests only, because a fork's token is
# read-only and the run would fail at that check instead of computing.
permissions:
  contents: write

jobs:
  version-dry-run:
    name: The next version is computed, not guessed
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    steps:
      - name: Checkout the pull request branch
        uses: actions/checkout@v7
        with:
          # The branch itself, not the detached merge ref: semantic-release only
          # analyses a named branch that exists on the remote.
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Install dependencies
        # --ignore-scripts: this job runs before review with a token that can
        # push; a dependency's install script does not get to run with it.
        run: npm clean-install --ignore-scripts

      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: npm audit signatures

      - name: Compute the next version and check it against the label
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          HAS_MAJOR_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'release:major') }}
        run: .github/scripts/version-dry-run.sh
