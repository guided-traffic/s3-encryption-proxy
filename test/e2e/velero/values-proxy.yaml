# Helm values for the proxy under test in the kind e2e cluster.
#
# Two of these settings are load-bearing and easy to get wrong:
#   - affinity must be null, not {}. Helm coalesces maps, so {} leaves the
#     chart default podAntiAffinity in place.
#   - image.pullPolicy must be Never. The published image is amd64-only; the
#     e2e builds for the node architecture and side-loads it with kind load.
#
# The probe scheme is deliberately NOT set here. The chart derives it from
# tls.enabled in the config below; stating it would hide a regression in that
# derivation behind a values file, and this suite is what proves it works.
fullnameOverride: s3ep-proxy
replicaCount: 1

image:
  registry: docker.io
  repository: guidedtraffic/s3-encryption-proxy
  tag: e2e
  pullPolicy: Never

service:
  # NodePort, not ClusterIP: Velero's BackupStorageLocation publicUrl is
  # https://127.0.0.1:30443, minted in-cluster and fetched from the host, and
  # kind-config.yaml maps exactly that port. A NodePort Service still gets a
  # ClusterIP, so the in-cluster URL keeps working through the same Service.
  type: NodePort
  port: 8443
  targetPort: 8443
  nodePort: 30443

podSecurityContext:
  fsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 2
  periodSeconds: 3
  timeoutSeconds: 3
  failureThreshold: 5

affinity: null

volumes:
  - name: tls
    projected:
      defaultMode: 0440
      sources:
        - secret:
            name: s3ep-tls
        - secret:
            name: s3ep-ca
volumeMounts:
  - name: tls
    mountPath: /app/tls
    readOnly: true

env:
  - name: S3EP_LICENSE_TOKEN
    valueFrom:
      secretKeyRef:
        name: s3ep-license
        key: license.jwt
  # Go reads SSL_CERT_FILE for the system root pool. Pointing it at the test CA
  # means the proxy validates the MinIO certificate for real instead of falling
  # back to insecure_skip_verify.
  - name: SSL_CERT_FILE
    value: /app/tls/ca.crt

# The key is generated by e2e-up.sh into a Secret it manages, and reaches the
# pod as S3EP_AES_KEY through the chart's own wiring (ADR 0021). Using the
# chart path rather than an env entry means the e2e run exercises it.
secrets:
  encryption:
    existingSecret: s3ep-aes-key
    existingSecretKey: aes-key

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

config: |
  bind_address: "0.0.0.0:8443"
  log_level: "debug"
  # json so the health scan can match "level":"error" exactly instead of
  # substring-matching prose.
  log_format: "json"
  log_health_requests: false

  tls:
    enabled: true
    cert_file: "/app/tls/tls.crt"
    key_file: "/app/tls/tls.key"

  s3_backend:
    # HTTPS is required, not preferred: the SDK can only send an unseekable
    # stream with UNSIGNED-PAYLOAD, and it only accepts that over TLS.
    target_endpoint: "https://minio.minio.svc.cluster.local:9000"
    region: "us-east-1"
    access_key_id: "minioadmin"
    secret_key: "minioadmin123"
    # Verification stays on. The proxy trusts the test CA through SSL_CERT_FILE
    # below, so the backend chain is really validated.
    insecure_skip_verify: false

  s3_clients:
    - type: "static"
      access_key_id: "velero-e2e"
      secret_key: "velero-secret-key-32-characters"
      description: "Velero e2e client"

  s3_security:
    max_clock_skew_seconds: 300
    max_presign_expiry_seconds: 3600  # default, one hour

  monitoring:
    enabled: true
    bind_address: ":9090"
    metrics_path: "/metrics"

  encryption:
    encryption_method_alias: "aes-envelope"
    providers:
      - alias: "aes-envelope"
        type: "aes"
        description: "AES envelope encryption"
        config:
          aes_key: "${S3EP_AES_KEY}"

  optimizations:
    streaming_segment_size: 12582912
    multipart_upload_concurrency: 4
    multipart_short_part_buffer_size: 67108864
