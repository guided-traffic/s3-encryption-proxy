---
# Server configuration
bind_address: "0.0.0.0:8443"

# TLS listener. The integration suite needs an HTTPS endpoint because
# aws-sdk-go-v2 only switches to STREAMING-UNSIGNED-PAYLOAD-TRAILER framing and
# checksum trailers over TLS. Over plain HTTP that code path is unreachable,
# which is why BUG-001 shipped unnoticed.
tls:
  enabled: true
  cert_file: "/certs/public.crt"
  key_file: "/certs/private.key"

log_level: "debug"
log_format: "text"   # "text" (default) or "json" - controls log output format

log_health_requests: false  # Disable health endpoint logging by default

# S3 backend configuration (unified structure)
# Credentials support ${VAR} environment variable references, e.g.:
#   access_key_id: "${S3_ACCESS_KEY_ID}"
#   secret_key: "${S3_SECRET_KEY}"
s3_backend:
  target_endpoint: "https://minio:9000"
  region: "us-east-1"
  access_key_id: "minioadmin"
  secret_key: "minioadmin123"
  insecure_skip_verify: true

# S3 Client Authentication Configuration (Enterprise Security)
# This enables strict authentication for all S3 API calls
s3_clients:
  # Production application client
  - type: "static"
    access_key_id: "username0"
    secret_key: "this-is-not-very-secure" # minimum 16 characters
    description: "the user0 has same accessright like s3_backend-credentials"

  # Backend service client
  - type: "static"
    access_key_id: "username1"
    secret_key: "this-is-even-worse" # minimum 16 characters
    description: "the user1 has same accessright like s3_backend-credentials"

# S3 Security Configuration
s3_security:
  # Maximum allowed clock skew in seconds (default: 900 = 15 minutes)
  # Shorter values provide better security against replay attacks
  max_clock_skew_seconds: 300  # 5 minutes for high security
  # Longest lifetime a pre-signed URL may declare, in seconds. Below the S3
  # maximum of seven days on purpose: a leaked URL is a bearer credential
  # for exactly as long as it says.
  max_presign_expiry_seconds: 3600  # default, one hour

monitoring:
  enabled: true
  bind_address: ":9091"
  metrics_path: "/metrics"
  # /debug/pprof runs on its own listener and may only bind a loopback address:
  # a heap profile of this process contains DEKs and plaintext buffers. A
  # non-loopback pprof_bind_address is a startup error, not a warning.
  # It is therefore NOT reachable on the published monitoring port. From the
  # host, use a container that shares the proxy network namespace:
  #   docker run --rm --network container:proxy-tls curlimages/curl \
  #     -s 'http://127.0.0.1:6060/debug/pprof/profile?seconds=25' -o proxy-cpu.out
  pprof_enabled: true
  pprof_bind_address: "127.0.0.1:6060"  # default

# Specify custom path to license file
# If not specified, defaults to "config/license.jwt"
license_file: "config/license.jwt"

# Multi-Provider Encryption Configuration
encryption:
  # Active encryption method (used for writing new files) - CORRECTED ARCHITECTURE!
  encryption_method_alias: "aes-envelope"

  # Custom metadata prefix - this will be used instead of default "s3ep-"
  # All encryption metadata keys will use this prefix
  # metadata_key_prefix: "mycompany-enc-"

  # List of KEK providers (correct architecture)
  providers:
    - alias: "aes-envelope"
      type: "aes"
      description: "AES envelope encryption"
      config:
        # The key is supplied through the environment and generated on demand:
        # scripts/gen-keys.sh writes S3EP_AES_KEY to the ignored .env file.
        # No usable key is tracked in this repository (ADR 0021), so an unset
        # variable fails the load and the proxy refuses to start.
        aes_key: "${S3EP_AES_KEY}"

# Performance Optimizations Configuration
optimizations:
  # Streaming segment size for multipart uploads (5MB - 5GB)
  # Default: 12MB (12582912 bytes)
  # This defines how much data is collected before sending as one S3 upload part
  # Must be a multiple of 64 KiB, or the proxy refuses to start.
  streaming_segment_size: 12582912  # 12MB = 12 * 1024 * 1024 bytes

  # Multipart upload parallelism (1 - 32)
  # Number of concurrent S3 UploadPart requests dispatched from putObjectAutoMultipart.
  # Sealing stays in order; only the S3 network round-trip runs in parallel.
  # Default: 4
  multipart_upload_concurrency: 4

  # What one client-driven multipart upload may hold for a final part that does
  # not cover whole segments: it cannot be stored on its own, so it waits in
  # memory until CompleteMultipartUpload. Bounded per open upload, not across
  # them; a client over the bound is answered 503 SlowDown and retries.
  # Sizing the container against these three keys: docs/developer/performance.md
  # Default: 64MB, minimum 5MB
  multipart_short_part_buffer_size: 67108864
