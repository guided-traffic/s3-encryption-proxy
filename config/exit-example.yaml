---
# The exit provider: leaving the product without leaving the data behind.
#
# `exit` is the active provider, so every new object is stored exactly as the
# client sent it - no data key is created and no s3ep-* metadata is written.
# The `aes` provider listed next to it writes nothing; it is there because an
# object this proxy encrypted earlier names the key that wrapped it in its own
# s3ep-kek-fingerprint metadata, and that provider is what unwraps it. Remove
# it and those objects stop being readable.
#
# The startup license gate looks only at the active provider, so this file
# starts the proxy without a license - which is the point of the exit provider.

# Server configuration
bind_address: "0.0.0.0:8080"  # default

log_level: "debug"   # example; default "info"
log_format: "text"   # default; "text" or "json"

log_health_requests: false  # default

# S3 backend configuration (unified structure)
s3_backend:
  target_endpoint: "https://minio:9000"  # example
  region: "us-east-1"                    # default
  access_key_id: "minioadmin"            # example
  secret_key: "minioadmin123"            # example
  insecure_skip_verify: true             # example; default false

# S3 Client Authentication Configuration (Enterprise Security)
# This enables strict authentication for all S3 API calls
s3_clients:
  # Production application client
  - type: "static"
    access_key_id: "username0"
    secret_key: "this-is-not-very-secure" # minimum 16 characters
    description: "the user0 has same accessright like s3_backend-credentials"

  # Backend service client
  - type: "static"
    access_key_id: "username1"
    secret_key: "this-is-even-worse" # minimum 16 characters
    description: "the user1 has same accessright like s3_backend-credentials"

# S3 Security Configuration
s3_security:
  # Maximum allowed clock skew in seconds
  # Shorter values provide better security against replay attacks
  max_clock_skew_seconds: 300  # example, 5 minutes; default 900

monitoring:
  enabled: true          # example; default false
  bind_address: ":9090"  # default
  metrics_path: "/metrics"  # default

# license_file has no entry here on purpose: the exit provider is admitted
# without a license. Point it at a token only if you plan to switch the active
# alias back to an encrypting provider.

# Encryption configuration - the exit setup
encryption:
  # The prefix is the proxy's own metadata namespace and is what tells an object
  # it wrote from one it did not. Changing it here hides the old objects from
  # the read path, so it stays whatever the encrypting configuration used.
  # metadata_key_prefix: "s3ep-"  # default

  # Active provider: writes plaintext.
  encryption_method_alias: "exit"

  providers:
    - alias: "exit"
      type: "exit"
      description: "Stores what the client sends; holds no key material"

    # Not active, never writes. Registered so that objects encrypted under this
    # key before the switch are still decrypted on read.
    - alias: "aes-previous"
      type: "aes"
      description: "The key the objects already in the bucket were written with"
      config:
        # The same variable aes-example.yaml uses, so a demo stack switched to
        # the exit provider still reads what it wrote (ADR 0021, ADR 0025).
        aes_key: "${S3EP_AES_KEY}"

# Performance Optimizations Configuration
optimizations:
  # Streaming segment size for multipart uploads (5MB - 5GB)
  # This defines how much data is collected before sending as one S3 upload part
  streaming_segment_size: 12582912  # default, 12MB

  # Chunked Encoding Behavior Control
  # aws-chunked decoding has to stay on: with it off the chunk framing is never
  # stripped, and pass-through means that framing lands in the stored object.
  clean_aws_signature_v4_chunked: true  # default
  # net/http already decodes Transfer-Encoding: chunked before the handler; this
  # decoder only matters for a backend that hands through raw framing.
  clean_http_transfer_chunked: true     # default
